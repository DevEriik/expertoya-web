<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link id="favicon-dark" rel="icon" type="image/svg+xml" href="/favicon-dark.svg"
    media="(prefers-color-scheme: dark)" />
  <link id="favicon-light" rel="icon" type="image/svg+xml" href="/favicon-light.svg"
    media="(prefers-color-scheme: light)" />
  <link id="favicon-default" rel="icon" type="image/svg+xml" href="/favicon-light.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>ExpertoYa! | Contratación de Oficios Locales</title>
  <script>
    (function () {
      const stored = localStorage.getItem("expertoya_theme");
      const systemDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (stored === "dark" || (!stored && systemDark)) {
        document.documentElement.classList.add("dark");
      } else {
        document.documentElement.classList.remove("dark");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
